[project]
name = "printcrm-server"
version = "0.1.0"
description = "Async FastAPI backend for print shops: staff management, JWT auth and automatic PostgreSQL audit trails"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncio>=4.0.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "click>=8.5.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "aiosqlite>=0.22.0",
    "httpx>=0.28.0,<1.0",
]
migrations = [
    "alembic>=1.20.1",
]

[tool.ruff]
extend-exclude = ["tests", "alembic"]

[tool.ruff.lint]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["core"]
